services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lmc
      POSTGRES_PASSWORD: lmc
      POSTGRES_DB: lmc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmc -d lmc"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lmc
      MINIO_ROOT_PASSWORD: lmc-minio-local
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lmc:lmc@postgres:5432/lmc
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lmc:lmc@postgres:5432/lmc
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_started

  collector:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lmc:lmc@postgres:5432/lmc
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["python", "-m", "collector"]
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
