name: deploy-vps

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: "cursor/database-mart-acceso-a5bc"
  repository_dispatch:
    types: [deploy-lmc]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Resolver ref
        id: ref
        run: |
          set -euo pipefail
          REF='cursor/database-mart-acceso-a5bc'
          if [[ "${{ github.event_name }}" == "repository_dispatch" && -n "${{ github.event.client_payload.ref }}" ]]; then
            REF='${{ github.event.client_payload.ref }}'
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.ref }}" ]]; then
            REF='${{ github.event.inputs.ref }}'
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Instalar sshpass y rsync
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass rsync

      - name: Desplegar en Database Mart
        id: deploy
        env:
          SECRET_PASS: ${{ secrets.VPS_SSH_PASS }}
          DISPATCH_PASS: ${{ github.event.client_payload.ssh_pass }}
          BOOTSTRAP_ADMIN_USER: pmccoahuila@gmail.com
          BOOTSTRAP_ADMIN_EMAIL: pmccoahuila@gmail.com
          BOOTSTRAP_ADMIN_PASSWORD: tachy8507
        run: |
          set -euo pipefail
          VPS_SSH_PASS="${SECRET_PASS:-${DISPATCH_PASS:-}}"
          if [[ -z "${VPS_SSH_PASS}" ]]; then
            echo "Falta VPS_SSH_PASS o client_payload.ssh_pass"
            exit 1
          fi
          echo "::add-mask::${VPS_SSH_PASS}"
          printf '%s' "$VPS_SSH_PASS" > /tmp/vps-ssh-pass
          chmod 600 /tmp/vps-ssh-pass
          test -f deploy/vps/deploy.sh
          chmod +x deploy/vps/deploy.sh
          set -o pipefail
          ./deploy/vps/deploy.sh 2>&1 | tee /tmp/deploy-out.txt

      - name: Comprobar URL pública y login
        if: success()
        env:
          BOOTSTRAP_ADMIN_USER: pmccoahuila@gmail.com
          BOOTSTRAP_ADMIN_PASSWORD: tachy8507
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 8 10; do
            code=$(curl -sS -m 20 -o /tmp/out.html -w '%{http_code}' http://108.181.203.225:10049/census/login || true)
            echo "intento $i → $code"
            if [[ "$code" == "200" ]] && grep -q 'LA MV Census' /tmp/out.html; then
              break
            fi
            sleep 5
          done
          test "${code:-}" = "200"
          pip -q install playwright >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import os
          url = "http://108.181.203.225:10049/census/login"
          user = os.environ["BOOTSTRAP_ADMIN_USER"]
          password = os.environ["BOOTSTRAP_ADMIN_PASSWORD"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="networkidle", timeout=60000)
              page.fill('input[name="username"]', user)
              page.fill('input[name="password"]', password)
              page.click('button[type="submit"]')
              page.wait_for_timeout(15000)
              final = page.url
              browser.close()
          print("final_url", final)
          if "/estudios" not in final:
              raise SystemExit("login no entró a /estudios")
          print("LOGIN_OK")
          PY

      - name: Subir salida del deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-out
          path: /tmp/deploy-out.txt
          if-no-files-found: ignore

      - name: Resumen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Deploy VPS"
            echo
            echo "- status: ${{ job.status }}"
            echo "- ref: ${{ steps.ref.outputs.ref }}"
            echo "- url: http://108.181.203.225:10049/census/login"
            echo
            echo '```'
            if [[ -f /tmp/deploy-out.txt ]]; then
              sed -E 's/(PASS|assword|ssh_pass|tachy8507)[=:]?[^[:space:]]*/\1=REDACTED/Ig' /tmp/deploy-out.txt | tail -n 120
            else
              echo "(sin salida)"
            fi
            echo '```'
          } | tee /tmp/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          jq -n --rawfile body /tmp/summary.md '{body: $body}' > /tmp/comment.json
          curl -sS -m 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/9/comments" \
            -d @/tmp/comment.json | head -c 160
          echo
