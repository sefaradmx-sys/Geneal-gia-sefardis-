name: census-status

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/database-mart-acceso-a5bc

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Comprobar el tablero público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          report=$(mktemp)
          {
            python3 - << 'PY'
          import socket
          host = "108.181.203.225"
          for port in (10049, 10050, 10048, 80):
              sock = socket.socket()
              sock.settimeout(8)
              try:
                  sock.connect((host, port))
                  print(f"{port} open")
              except Exception as exc:
                  print(f"{port} {type(exc).__name__}")
              finally:
                  sock.close()
          PY
            echo "http:$(curl -sS -m 20 -D /tmp/census.hdr -o /tmp/census.body -w '%{http_code}' http://108.181.203.225:10049/census/login)"
            echo "--- headers ---"
            head -n 15 /tmp/census.hdr
            echo "--- body ---"
            head -c 160 /tmp/census.body
            echo
          } > "$report" 2>&1
          cat "$report"
          jq -n --rawfile body "$report" '{body: $body, path: ".github/workflows/census-status.yml", line: 1, side: "RIGHT"}' > /tmp/comment.json
          curl -sS -m 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d @/tmp/comment.json \
            -o /tmp/comment-res.json -w "comment:%{http_code}\n"
          head -c 200 /tmp/comment-res.json
          echo
