name: publicar-hostgator

on:
  push:
    branches:
      - cursor/hostgator-subdominio-766c
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hostgator:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/hostgator-subdominio-766c

      - name: Entrar por SSH y publicar
        env:
          HOSTGATOR_SSH_HOST: ${{ secrets.HOSTGATOR_SSH_HOST }}
          HOSTGATOR_SSH_USER: ${{ secrets.HOSTGATOR_SSH_USER }}
          HOSTGATOR_SSH_PASS: ${{ secrets.HOSTGATOR_SSH_PASS }}
          HOSTGATOR_SSH_PORT: ${{ secrets.HOSTGATOR_SSH_PORT }}
        run: |
          set -u
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          chmod +x scripts/hostgator-ssh.sh
          if [ -n "${HOSTGATOR_SSH_PASS}" ]; then
            printf '%s' "$HOSTGATOR_SSH_PASS" > /tmp/hostgator-ssh-pass
            chmod 600 /tmp/hostgator-ssh-pass
            export HOSTGATOR_SSH_PASS_FILE=/tmp/hostgator-ssh-pass
          fi
          if [ -z "${HOSTGATOR_SSH_HOST}" ]; then
            export HOSTGATOR_SSH_HOST=mx18.hostgator.mx
          fi
          if [ -z "${HOSTGATOR_SSH_PORT}" ]; then
            export HOSTGATOR_SSH_PORT=2222
          fi
          bash scripts/hostgator-ssh.sh
          rm -f /tmp/hostgator-ssh-pass

      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "cursor"
          git config user.email "cursor@users.noreply.github.com"
          git add hostgator/estado.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Estado SSH de HostGator [skip ci]"
          git push
