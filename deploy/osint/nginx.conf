server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = /api/tool-stats {
        default_type application/json;
        return 200 '{"ok":true,"ratings":{"average":0,"count":0}}';
    }

    location = /api/vote {
        default_type application/json;
        return 200 '{"ok":false}';
    }

    location = /api/report {
        default_type application/json;
        return 200 '{"ok":true,"counted":false}';
    }

    location = /osint {
        return 301 /osint/;
    }

    location = /osint/ {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html;
    }

    location /osint/ {
        rewrite ^/osint/(.*)$ /$1 break;
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
