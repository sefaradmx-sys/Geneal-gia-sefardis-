server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = /osint {
        return 301 /osint/;
    }

    location = /osint/ {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html;
    }

    location /osint/ {
        rewrite ^/osint/(.*)$ /$1 break;
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
